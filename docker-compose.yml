version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pdfwizard-postgres
    environment:
      POSTGRES_DB: pdfwizard_db
      POSTGRES_USER: wizard
      POSTGRES_PASSWORD: wizardpassword
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pdfwizard-redis
    ports:
      - "6380:6379"

volumes:
  pgdata: